name: Workflow YAML validation

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: workflow-yaml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Parse every Actions workflow
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install pinned YAML parser
        run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2

      - name: Validate workflow YAML and known failure pattern
        run: python scripts/validate_github_workflows.py --self-test
