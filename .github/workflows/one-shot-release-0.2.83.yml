name: One-shot prepare SDR Town 0.2.83

on:
  push:
    branches: ['release-prep/v0.2.83']
    paths:
      - '.github/workflows/one-shot-release-0.2.83.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release preparation branch
        uses: actions/checkout@v7
        with:
          ref: release-prep/v0.2.83
          fetch-depth: 0

      - name: Set version metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('CMakeLists.txt'): (
                  'project(SDR_Town VERSION 0.2.82 LANGUAGES CXX)',
                  'project(SDR_Town VERSION 0.2.83 LANGUAGES CXX)',
              ),
              Path('README.md'): (
                  '**Current version** | **0.2.82** (experimental channel)',
                  '**Current version** | **0.2.83** (experimental channel)',
              ),
              Path('SOURCE_OF_TRUTH.md'): (
                  'CURRENT VERSION IN TREE: 0.2.82',
                  'CURRENT VERSION IN TREE: 0.2.83',
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              found = text.count(old)
              if found != 1:
                  raise SystemExit(f'{path}: expected one occurrence of {old!r}, found {found}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('.github/workflows/one-shot-release-0.2.83.yml').unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt README.md SOURCE_OF_TRUTH.md \
            .github/workflows/one-shot-release-0.2.83.yml
          git commit -m 'release: set version 0.2.83'
          git push origin HEAD:release-prep/v0.2.83
