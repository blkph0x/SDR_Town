name: One-shot Satcom listen takeover correction

on:
  push:
    branches: ['hardening/non-p25-20260922']
    paths:
      - '.github/workflows/one-shot-satcom-takeover-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v7
        with:
          ref: hardening/non-p25-20260922
          fetch-depth: 0

      - name: Apply precise Satcom takeover correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/SatcomScannerWidget.cpp')
          text = path.read_text(encoding='utf-8')
          replacements = (
              (
                  'if (!SatcomScannerEngine::instance().start(false)) {',
                  'if (!SatcomScannerEngine::instance().start(true)) {',
                  1,
              ),
              (
                  'if (!engine.start(false)) {',
                  'if (!engine.start(true)) {',
                  1,
              ),
              (
                  'if (!engine.armPass(best->satId, best->downlinkId, true, false, &error)) {',
                  'if (!engine.armPass(best->satId, best->downlinkId, true, true, &error)) {',
                  1,
              ),
          )

          for old, new, expected in replacements:
              found = text.count(old)
              if found != expected:
                  raise SystemExit(f'expected {expected} occurrence(s) of {old!r}, found {found}')
              text = text.replace(old, new, expected)

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/one-shot-satcom-takeover-fix.yml').unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/SatcomScannerWidget.cpp .github/workflows/one-shot-satcom-takeover-fix.yml
          git commit -m 'fix(satcom): take ordinary listen receiver for scan and auto pass'
          git push origin HEAD:hardening/non-p25-20260922
