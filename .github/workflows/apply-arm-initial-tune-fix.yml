name: Apply Arm Pass initial retune safeguard

on:
  push:
    branches:
      - fix/rspdx-arm-pass

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/rspdx-arm-pass
          fetch-depth: 0
      - name: Apply source changes
        run: python3 scripts/apply_arm_initial_tune_fix.py
      - name: Commit source changes
        run: |
          git config user.name "SDR Town CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Ensure Arm Pass tunes and validates its receiver"
          git push origin HEAD:fix/rspdx-arm-pass
