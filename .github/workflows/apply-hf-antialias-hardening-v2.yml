name: Apply corrected high-rate HF anti-alias hardening

on:
  push:
    branches:
      - fix/hf-receive-hardening
    paths:
      - scripts/apply_hf_antialias_hardening_v2.py
      - .github/workflows/apply-hf-antialias-hardening-v2.yml

permissions:
  contents: write

concurrency:
  group: apply-corrected-high-rate-hf-antialias-hardening
  cancel-in-progress: false

jobs:
  apply:
    name: Harden multi-MS/s HF rate conversion
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: fix/hf-receive-hardening
          fetch-depth: 0

      - name: Apply corrected source and regression patch
        run: python3 scripts/apply_hf_antialias_hardening_v2.py

      - name: Commit candidate locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/HfDemod.cpp \
            tests/test_hf_demod.cpp \
            tests/hf_smoke.cpp \
            scripts/verify_hf_integration.py \
            docs/HF_RECEIVE.md
          git commit -m "Harden HF anti-aliasing for multi-MS/s SDR streams"

      - name: Validate committed candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin master
          base="$(git merge-base origin/master HEAD)"
          python3 scripts/verify_no_p25_changes.py --base "${base}" --head HEAD
          python3 scripts/test_no_p25_guard.py
          python3 scripts/verify_hf_integration.py
          g++ -std=c++20 -O2 -Wall -Wextra -pedantic \
            -Iinclude \
            tests/hf_smoke.cpp \
            src/HfDemod.cpp \
            -o hf_smoke
          ./hf_smoke
          git diff --check

      - name: Push validated candidate
        shell: bash
        run: git push origin HEAD:fix/hf-receive-hardening
