name: Prepare v0.2.84 metadata

on:
  push:
    branches:
      - prep/v0.2.84

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bump embedded project version
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('CMakeLists.txt'); s=p.read_text(encoding='utf-8'); old='project(SDR_Town VERSION 0.2.82 LANGUAGES CXX)'; new='project(SDR_Town VERSION 0.2.84 LANGUAGES CXX)'; assert old in s, 'expected 0.2.82 project version was not found'; p.write_text(s.replace(old, new, 1), encoding='utf-8', newline='\n')"
          rm .github/workflows/prepare-v0.2.84.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt .github/workflows/prepare-v0.2.84.yml
          git commit -m 'chore: set SDR Town version to 0.2.84'
          git push origin HEAD:prep/v0.2.84
