name: Windows CI

on:
  push:
    branches: [master, main, 'ci/**', 'refactor/**']
  pull_request:
    branches: [master, main]

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: MSVC Release build + tests
    runs-on: windows-2022
    timeout-minutes: 180

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          cache: true
          setup-python: false

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        id: runvcpkg
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          # 2024.12.16 release tag commit
          vcpkgGitCommitId: 'b2cb0da531c2f1f740045bfe7c4dac59f0b2b69c'
          runVcpkgInstall: true

      - name: Configure CMake (VS 2022)
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DBUILD_TESTS=ON `
            -DSDR_TOWN_ENABLE_MBELIB=ON
        shell: pwsh

      - name: Build SDR_Town + tests
        run: cmake --build build --config Release --target SDR_Town sdr_town_tests -j 4
        shell: pwsh

      - name: Run unit tests
        run: |
          $candidates = @(
            "build/bin/Release/sdr_town_tests.exe",
            "build/bin/sdr_town_tests.exe",
            "build/Release/sdr_town_tests.exe"
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "sdr_town_tests.exe not found" }
          Write-Host "Running $exe"
          & $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Phase 2 string verifiers
        run: |
          $fail = 0
          $ok = 0
          Get-ChildItem src/tools/verify_p25_phase2_*.py | Sort-Object Name | ForEach-Object {
            python $_.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Host "FAIL $($_.Name)"
              $fail++
            } else {
              $ok++
            }
          }
          Write-Host "PASS=$ok FAIL=$fail"
          if ($fail -gt 0) { exit 1 }
        shell: pwsh
