name: Windows CI

on:
  push:
    branches: [master, main, 'ci/**', 'refactor/**']
  pull_request:
    branches: [master, main]

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: MSVC Release build + tests
    runs-on: windows-2022
    timeout-minutes: 180

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: ''
          cache: true
          setup-python: false

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgGitCommitId: '2024.12.16'
          runVcpkgInstall: true
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Configure CMake
        run: |
          cmake -S . -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DBUILD_TESTS=ON `
            -DSDR_TOWN_ENABLE_MBELIB=ON
        shell: pwsh

      - name: Build SDR_Town + tests
        run: cmake --build build --config Release --target SDR_Town sdr_town_tests -j 4
        shell: pwsh

      - name: Run unit tests
        run: |
          $exe = "build/bin/Release/sdr_town_tests.exe"
          if (-not (Test-Path $exe)) { $exe = "build/bin/sdr_town_tests.exe" }
          & $exe
        shell: pwsh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Phase 2 string verifiers
        run: |
          $fail = 0
          $ok = 0
          Get-ChildItem src/tools/verify_p25_phase2_*.py | Sort-Object Name | ForEach-Object {
            python $_.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Host "FAIL $($_.Name)"
              $fail++
            } else {
              $ok++
            }
          }
          Write-Host "PASS=$ok FAIL=$fail"
          if ($fail -gt 0) { exit 1 }
        shell: pwsh
