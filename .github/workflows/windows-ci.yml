name: Windows CI

on:
  push:
    branches: [master, main, 'ci/**', 'feature/**', 'refactor/**', 'fix/**']
  pull_request:
    branches: [master, main]

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: MSVC Release build + tests
    runs-on: windows-2022
    timeout-minutes: 180

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # Do not use submodules: recursive. Build dependencies are checked out explicitly below.

      - name: Checkout build submodules (miniaudio + mbelib only)
        shell: pwsh
        run: |
          git submodule update --init --depth 1 -- external/miniaudio external/mbelib
          if (-not (Test-Path external/miniaudio/miniaudio.h)) {
            throw "external/miniaudio/miniaudio.h missing after submodule update"
          }
          if (-not (Test-Path external/mbelib/CMakeLists.txt)) {
            throw "external/mbelib/CMakeLists.txt missing after submodule update"
          }

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          cache: true
          setup-python: false

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "${{ github.workspace }}/vcpkg"
          & "${{ github.workspace }}/vcpkg/bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure CMake (VS 2022 + vcpkg manifest)
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DBUILD_TESTS=ON `
            -DSDR_TOWN_ENABLE_MBELIB=ON `
            -DSDR_TOWN_BUILD_RDS_DSP=OFF
          # CI covers native core; the MinGW MPX backend has separate full-release gates.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build SDR_Town + native tests
        shell: pwsh
        run: |
          cmake --build build --config Release `
            --target SDR_Town sdr_town_tests sdr_town_workspace_tests -j 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run core unit tests
        shell: pwsh
        run: |
          $candidates = @(
            "build/bin/Release/sdr_town_tests.exe",
            "build/bin/sdr_town_tests.exe",
            "build/Release/sdr_town_tests.exe"
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "sdr_town_tests.exe not found" }
          Write-Host "Running $exe"
          & $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Qt workspace and live-decoder tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $candidates = @(
            "build/bin/Release/sdr_town_workspace_tests.exe",
            "build/bin/sdr_town_workspace_tests.exe",
            "build/Release/sdr_town_workspace_tests.exe"
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "sdr_town_workspace_tests.exe not found" }
          Write-Host "Running $exe"
          & $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Phase 2 verifier regression gate
        shell: pwsh
        run: |
          $baselinePath = ".github/p25-phase2-known-stale-verifiers.txt"
          if (-not (Test-Path $baselinePath)) { throw "Missing $baselinePath" }
          $known = @(
            Get-Content $baselinePath |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ -and -not $_.StartsWith('#') }
          )
          $ok = 0
          $knownFailures = @()
          $unexpectedFailures = @()
          $resolvedBaseline = @()

          Get-ChildItem src/tools/verify_p25_phase2_*.py | Sort-Object Name | ForEach-Object {
            python $_.FullName
            $failed = $LASTEXITCODE -ne 0
            $isKnown = $known -contains $_.Name
            if ($failed) {
              if ($isKnown) {
                Write-Host "KNOWN STALE $($_.Name)"
                $knownFailures += $_.Name
              } else {
                Write-Host "UNEXPECTED FAIL $($_.Name)"
                $unexpectedFailures += $_.Name
              }
            } else {
              $ok++
              if ($isKnown) { $resolvedBaseline += $_.Name }
            }
          }

          Add-Content $env:GITHUB_STEP_SUMMARY "### Phase 2 source-verifier report"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Passing: $ok"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Known stale failures: $($knownFailures.Count)"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Unexpected failures: $($unexpectedFailures.Count)"
          if ($knownFailures.Count -gt 0) {
            Add-Content $env:GITHUB_STEP_SUMMARY ""
            Add-Content $env:GITHUB_STEP_SUMMARY "Known stale verifiers (tracked, non-blocking):"
            $knownFailures | ForEach-Object { Add-Content $env:GITHUB_STEP_SUMMARY "- ``$_``" }
          }
          if ($resolvedBaseline.Count -gt 0) {
            Add-Content $env:GITHUB_STEP_SUMMARY ""
            Add-Content $env:GITHUB_STEP_SUMMARY "Baseline entries now passing; remove these from the baseline:"
            $resolvedBaseline | ForEach-Object { Add-Content $env:GITHUB_STEP_SUMMARY "- ``$_``" }
          }
          if ($unexpectedFailures.Count -gt 0) {
            Add-Content $env:GITHUB_STEP_SUMMARY ""
            Add-Content $env:GITHUB_STEP_SUMMARY "Unexpected verifier regressions:"
            $unexpectedFailures | ForEach-Object { Add-Content $env:GITHUB_STEP_SUMMARY "- ``$_``" }
            exit 1
          }

      - name: Release verifier negative tests
        shell: pwsh
        run: python scripts/test_verify_release.py
