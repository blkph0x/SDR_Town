name: Windows CI

on:
  workflow_dispatch:
  push:
    branches: [master, main, 'ci/**', 'feature/**', 'release/**', 'refactor/**', 'fix/**', 'hardening/**']
  pull_request:
    branches: [master, main]

permissions:
  contents: write

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: MSVC Release build, tests, and package
    runs-on: windows-2022
    timeout-minutes: 180

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      GITHUB_EVENT_BEFORE: ${{ github.event.before }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Release verifier negative tests
        shell: pwsh
        run: |
          python scripts/test_verify_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Enforce frozen P25 pipeline
        shell: pwsh
        run: |
          python scripts/test_no_p25_guard.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (-not [string]::IsNullOrWhiteSpace($env:GITHUB_BASE_REF)) {
            $base = "origin/$env:GITHUB_BASE_REF"
          } elseif (-not [string]::IsNullOrWhiteSpace($env:GITHUB_EVENT_BEFORE) -and
                    $env:GITHUB_EVENT_BEFORE -notmatch '^0+$') {
            $base = $env:GITHUB_EVENT_BEFORE
          } else {
            $base = "origin/master"
          }
          Write-Host "Checking frozen P25 paths between $base and HEAD"
          python scripts/verify_no_p25_changes.py --base $base --head HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checkout required build and packaging submodules
        shell: pwsh
        run: |
          git submodule update --init --depth 1 -- `
            external/miniaudio external/mbelib external/liquid-dsp
          if (-not (Test-Path external/miniaudio/miniaudio.h)) {
            throw "external/miniaudio/miniaudio.h missing after submodule update"
          }
          if (-not (Test-Path external/mbelib/CMakeLists.txt)) {
            throw "external/mbelib/CMakeLists.txt missing after submodule update"
          }
          if (-not (Test-Path external/liquid-dsp/LICENSE)) {
            throw "external/liquid-dsp/LICENSE missing after submodule update"
          }

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          cache: true
          setup-python: false

      - name: Install pinned Rust for SSTV
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "${{ github.workspace }}/vcpkg"
          & "${{ github.workspace }}/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure CMake (VS 2022 + vcpkg manifest)
        shell: pwsh
        run: |
          # DEC-0130: publish the RDS backend too, not a reduced CI-only build.
          $candidates = @('C:\mingw64\bin\gcc.exe', 'C:\msys64\mingw64\bin\gcc.exe')
          $candidates += @(Get-Command x86_64-w64-mingw32-gcc,gcc -ErrorAction SilentlyContinue | ForEach-Object { $_.Source })
          $cc = $null
          foreach ($candidate in $candidates) {
            if (-not (Test-Path -LiteralPath $candidate)) { continue }
            $bin = Split-Path $candidate
            $cxx = Join-Path $bin 'g++.exe'
            $make = Join-Path $bin 'mingw32-make.exe'
            if ((Test-Path $cxx) -and (Test-Path $make) -and ((& $candidate -dumpmachine) -eq 'x86_64-w64-mingw32')) {
              $cc = $candidate
              break
            }
          }
          if (-not $cc) { throw "Matching x64 MinGW GCC/G++/make required for published RDS support" }
          Write-Host "RDS toolchain: $cc"
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DBUILD_TESTS=ON `
            -DSDR_TOWN_ENABLE_MBELIB=ON `
            -DSDR_TOWN_ENABLE_SSTV_IMAGES=ON `
            -DSDR_TOWN_BUILD_RDS_DSP=ON `
            "-DSDR_TOWN_RDS_CC=$cc" "-DSDR_TOWN_RDS_CXX=$cxx" "-DSDR_TOWN_RDS_MAKE=$make"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checkout pinned RTL-SDR driver module
        uses: actions/checkout@v7
        with:
          repository: pothosware/SoapyRTLSDR
          ref: 6ca357c15cbf676ff30eb8eb445d1e1eac17c136
          path: build/rtl-driver-source
          persist-credentials: false

      - name: Build RTL-SDR driver with bias-T support
        shell: pwsh
        run: |
          cmake -S build/rtl-driver-source -B build/rtl-driver-build -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_PREFIX_PATH=$env:GITHUB_WORKSPACE/build/vcpkg_installed/x64-windows"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String build/rtl-driver-build/CMakeCache.txt -Pattern '^HAS_RTLSDR_SET_BIAS_TEE:INTERNAL=1$')) {
            throw "RTL-SDR module must compile with bias-T API support"
          }
          cmake --build build/rtl-driver-build --config Release --target rtlsdrSupport -j 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path build/bin/Release -Force | Out-Null
          Copy-Item build/rtl-driver-build/Release/rtlsdrSupport.dll build/bin/Release/SoapyRTLSDR.dll

      - name: Build SDR_Town and native tests
        shell: pwsh
        run: |
          cmake --build build --config Release `
            --target SDR_Town sdr_town_tests sdr_town_workspace_tests inmarsat_live_gui_tests -j 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run core unit tests
        shell: pwsh
        run: |
          $candidates = @(
            "build/bin/Release/sdr_town_tests.exe",
            "build/bin/sdr_town_tests.exe",
            "build/Release/sdr_town_tests.exe"
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "sdr_town_tests.exe not found" }
          Write-Host "Running $exe"
          & $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run SDRplay loader and Inmarsat lifecycle tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release -R "SdrplayRuntime|SdrplayControlLifecycle|RtlBiasTLifecycle|InmarsatLiveGui|InmarsatHostLifecycle" --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Qt workspace and live-decoder tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $candidates = @(
            "build/bin/Release/sdr_town_workspace_tests.exe",
            "build/bin/sdr_town_workspace_tests.exe",
            "build/Release/sdr_town_workspace_tests.exe"
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "sdr_town_workspace_tests.exe not found" }
          Write-Host "Running $exe"
          & $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Inmarsat GUI and CLI replay parity
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/verify_inmarsat_replay.py --exe build/bin/Release/SDR_Town.exe --out build/inmarsat-replay-ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run SSTV backend tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release -R SstvTransportRust --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build clean portable staging directory
        shell: pwsh
        run: |
          cmake --build build --config Release --target deploy -j 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $stage = Join-Path $env:GITHUB_WORKSPACE "build/deploy_staging"
          $exe = Join-Path $stage "SDR_Town.exe"
          if (-not (Test-Path $exe)) { throw "deploy staging did not produce SDR_Town.exe" }

          $sstv = Join-Path $stage "sdrtown_sstv.exe"
          if (-not (Test-Path $sstv)) {
            throw "portable staging is missing required SSTV image backend sdrtown_sstv.exe"
          }
          $sstvLicense = Join-Path $stage "licenses/sstv/sstv-MIT.txt"
          if (-not (Test-Path $sstvLicense)) {
            throw "portable staging is missing required SSTV notices"
          }

          $windeployqt = Join-Path $env:QT_ROOT_DIR "bin/windeployqt.exe"
          if (-not (Test-Path $windeployqt)) { throw "windeployqt.exe not found" }
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw "MSVC redistributable location unavailable" }
          $env:VCINSTALLDIR = Join-Path $vs 'VC/'
          & $windeployqt `
            --release `
            --dir $stage `
            --no-translations `
            --no-system-d3d-compiler `
            --no-opengl-sw `
            $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (-not (Test-Path (Join-Path $stage "Qt6Core.dll"))) {
            throw "portable staging is missing Qt6Core.dll"
          }
          $redist = Get-ChildItem (Join-Path $vs 'VC/Redist/MSVC') -Directory |
            Where-Object { $_.Name -match '^\d+\.' } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $redist) { throw "MSVC runtime redistributables unavailable" }
          $crt = Get-ChildItem (Join-Path $redist.FullName 'x64') -Directory -Filter 'Microsoft.VC*.CRT' | Select-Object -First 1
          if (-not $crt) { throw "x64 MSVC CRT directory unavailable" }
          Copy-Item (Join-Path $crt.FullName '*.dll') $stage
          Copy-Item build/rtl-driver-source/LICENSE.txt (Join-Path $stage 'licenses/SoapyRTLSDR-LICENSE.txt')
          foreach ($required in @('sdrtown_rds_dsp.dll', 'sdr_aero_codec.dll', 'SdrTownControl.dll', 'SoapyRTLSDR.dll', 'rtlsdr.dll', 'vcruntime140.dll', 'msvcp140.dll')) {
            if (-not (Test-Path (Join-Path $stage $required))) { throw "portable staging is missing $required" }
          }
          python scripts/test_rds_cli.py --exe $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create portable ZIP and checksum
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE "build/deploy_staging"
          $refName = $env:GITHUB_REF_NAME
          $projectLine = Select-String -Path "CMakeLists.txt" `
            -Pattern 'project\(SDR_Town VERSION ([0-9]+\.[0-9]+\.[0-9]+)' | Select-Object -First 1
          if (-not $projectLine) { throw "cannot read SDR_Town project version" }
          $projectVersion = $projectLine.Matches[0].Groups[1].Value

          if ($refName.StartsWith("release/")) {
            $tag = $refName.Substring("release/".Length)
            if (-not $tag.StartsWith("v")) { $tag = "v$tag" }
            $label = $tag.Substring(1)
            if (($label -split '-', 2)[0] -ne $projectVersion) {
              throw "release branch version must match CMake project version"
            }
          } else {
            $tag = ""
            $label = "$projectVersion-ci.$env:GITHUB_RUN_NUMBER"
          }

          $buildInfo = [ordered]@{
            version = $label
            projectVersion = $projectVersion
            branch = $refName
            commit = $env:GITHUB_SHA
            sourceCommit = $env:GITHUB_SHA
            executableSha256 = (Get-FileHash (Join-Path $stage "SDR_Town.exe") -Algorithm SHA256).Hash.ToLowerInvariant()
            workflowRun = $env:GITHUB_RUN_ID
            generatedUtc = (Get-Date).ToUniversalTime().ToString("o")
            sstvBackend = "required"
            p25PipelineGuard = "passed"
            rtlModuleCommit = "6ca357c15cbf676ff30eb8eb445d1e1eac17c136"
          }
          $buildInfo | ConvertTo-Json | Set-Content `
            (Join-Path $stage "build-info.json") -Encoding utf8

          $assetName = "SDR_Town-$label-win64.zip"
          $assetPath = Join-Path $env:GITHUB_WORKSPACE "build/$assetName"
          if (Test-Path $assetPath) { Remove-Item $assetPath -Force }
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $assetPath -Force

          $hash = (Get-FileHash $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $shaName = "$assetName.sha256"
          $shaPath = Join-Path $env:GITHUB_WORKSPACE "build/$shaName"
          "$hash  $assetName" | Set-Content $shaPath -Encoding ascii

          "PACKAGE_ASSET=$assetName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKAGE_SHA=$shaName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJECT_VERSION=$projectVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Add-Content $env:GITHUB_STEP_SUMMARY "### Portable tested build"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Asset: ``$assetName``"
          Add-Content $env:GITHUB_STEP_SUMMARY "- SHA-256: ``$hash``"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Commit: ``$env:GITHUB_SHA``"
          Add-Content $env:GITHUB_STEP_SUMMARY "- SSTV backend: required and packaged"
          Add-Content $env:GITHUB_STEP_SUMMARY "- P25 pipeline guard: passed"

      - name: Upload tested portable build
        uses: actions/upload-artifact@v7
        with:
          name: SDR_Town-${{ github.run_number }}-${{ github.sha }}
          path: |
            build/${{ env.PACKAGE_ASSET }}
            build/${{ env.PACKAGE_SHA }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish release assets
        if: github.event_name == 'push' && startsWith(github.ref_name, 'release/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) { throw "release branch did not produce a tag" }

          $asset = Join-Path $env:GITHUB_WORKSPACE "build/$env:PACKAGE_ASSET"
          $checksum = Join-Path $env:GITHUB_WORKSPACE "build/$env:PACKAGE_SHA"
          if (-not (Test-Path $asset) -or -not (Test-Path $checksum)) {
            throw "release assets are missing"
          }

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $exists = $LASTEXITCODE -eq 0
          if ($exists) {
            throw "Release $tag already exists; choose a new version rather than replacing published assets"
          } else {
            $notes = "docs/RELEASE_$env:PROJECT_VERSION.md"
            if (-not (Test-Path -LiteralPath $notes)) { throw "version-specific release notes missing: $notes" }
            $lowerTag = $tag.ToLowerInvariant()
            $isPrerelease = $lowerTag -match '(experimental|alpha|beta|rc|preview|test|pre)'
            if ($isPrerelease) {
              gh release create $tag $asset $checksum `
                --repo $env:GITHUB_REPOSITORY `
                --target $env:GITHUB_SHA `
                --title "SDR Town $tag" `
                --notes-file $notes `
                --prerelease
            } else {
              gh release create $tag $asset $checksum `
                --repo $env:GITHUB_REPOSITORY `
                --target $env:GITHUB_SHA `
                --title "SDR Town $tag" `
                --notes-file $notes
            }
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $url = gh release view $tag --repo $env:GITHUB_REPOSITORY --json url --jq .url
          Add-Content $env:GITHUB_STEP_SUMMARY ""
          Add-Content $env:GITHUB_STEP_SUMMARY "Published release: $url"

      - name: Verify public published asset
        if: github.event_name == 'push' && startsWith(github.ref_name, 'release/')
        shell: pwsh
        run: |
          # Anonymous download proves the release is public, not just a run artifact.
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG"
          $out = Join-Path $env:GITHUB_WORKSPACE "build/public-release-check"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          foreach ($name in @($env:PACKAGE_ASSET, $env:PACKAGE_SHA)) {
            Invoke-WebRequest "$base/$name" -OutFile (Join-Path $out $name) -MaximumRetryCount 3 -RetryIntervalSec 5
          }
          $download = Join-Path $out $env:PACKAGE_ASSET
          $expected = ((Get-Content (Join-Path $out $env:PACKAGE_SHA) -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash $download -Algorithm SHA256).Hash.ToLowerInvariant()
          $built = (Get-FileHash "build/$env:PACKAGE_ASSET" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected -or $actual -ne $built) { throw "public asset checksum mismatch" }
          Expand-Archive -LiteralPath $download -DestinationPath (Join-Path $out "extracted")
          $info = Get-Content (Join-Path $out "extracted/build-info.json") -Raw | ConvertFrom-Json
          if ($info.sourceCommit -ne $env:GITHUB_SHA -or $info.workflowRun -ne $env:GITHUB_RUN_ID) {
            throw "public asset provenance does not match this Actions run"
          }
          $exe = Join-Path $out "extracted/SDR_Town.exe"
          if ((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $info.executableSha256) {
            throw "published executable hash mismatch"
          }
          $process = Start-Process -FilePath $exe -ArgumentList '--allow-multiple --cli --no-remote-diagnostics --cmd "help"' `
            -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput (Join-Path $out "smoke.out") -RedirectStandardError (Join-Path $out "smoke.err")
          if ($process.ExitCode -ne 0) { throw "published executable failed CLI smoke test" }
          if (-not (Select-String -Path (Join-Path $out "smoke.out") -Pattern 'biastee <device>' -SimpleMatch)) {
            throw "published executable lacks expected RTL bias-T command"
          }
          python scripts/test_rds_cli.py --exe $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content $env:GITHUB_STEP_SUMMARY "Public download, checksum, provenance and CLI smoke test: PASS"
