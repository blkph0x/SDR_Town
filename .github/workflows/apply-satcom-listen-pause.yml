name: Apply Satcom active-listen pause

on:
  push:
    branches:
      - fix/satcom-scanner-audio-spectrum

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[satcom-listen-pause-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/satcom-scanner-audio-spectrum
          fetch-depth: 1
      - name: Apply active-listen pause repair
        run: python scripts/apply_satcom_listen_pause_fix.py
      - name: Remove one-shot patch machinery and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/apply_satcom_listen_pause_fix.py
          git rm .github/workflows/apply-satcom-listen-pause.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add include src tests
          git commit -m 'fix(satcom): pause ordinary DSP while tuner is leased [satcom-listen-pause-applied]'
          git push origin HEAD:fix/satcom-scanner-audio-spectrum
