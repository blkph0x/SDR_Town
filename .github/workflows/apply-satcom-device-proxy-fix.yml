name: Apply Satcom device proxy fix

on:
  push:
    branches:
      - fix/satcom-device-proxy-selection
    paths:
      - scripts/apply_satcom_device_proxy_fix.py
      - .github/workflows/apply-satcom-device-proxy-fix.yml

permissions:
  contents: write

concurrency:
  group: apply-satcom-device-proxy-fix
  cancel-in-progress: false

jobs:
  apply:
    name: Patch Satcom and Inmarsat device selection
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: fix/satcom-device-proxy-selection
          fetch-depth: 0

      - name: Apply guarded source patch
        run: python3 scripts/apply_satcom_device_proxy_fix.py

      - name: Validate source boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_no_p25_guard.py
          base="$(git merge-base origin/master HEAD)"
          python3 scripts/verify_no_p25_changes.py --base "${base}" --head HEAD
          git diff --check

      - name: Commit source-only fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            include/SdrDeviceCandidate.h \
            src/SatcomScannerEngine.cpp \
            src/SatcomScannerWidget.cpp \
            src/InmarsatEngine.cpp \
            src/InmarsatWidget.cpp \
            tests/test_satcom.cpp
          git commit -m "Fix Satcom and Inmarsat deferred hardware device selection"
          git push origin HEAD:fix/satcom-device-proxy-selection
