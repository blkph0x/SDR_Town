name: Prepare SDR Town 0.2.86 metadata

on:
  push:
    branches:
      - fix/release-v0.2.86-metadata
    paths:
      - .github/workflows/prepare-v0.2.86.yml

permissions:
  contents: write

concurrency:
  group: prepare-v0.2.86-metadata
  cancel-in-progress: false

jobs:
  prepare:
    name: Generate version and release notes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout release metadata branch
        uses: actions/checkout@v7
        with:
          ref: fix/release-v0.2.86-metadata
          fetch-depth: 0

      - name: Update release metadata deterministically
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8-sig")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one {old!r}, found {count}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace_exact(
              "CMakeLists.txt",
              "project(SDR_Town VERSION 0.2.82 LANGUAGES CXX)",
              "project(SDR_Town VERSION 0.2.86 LANGUAGES CXX)",
          )
          replace_exact(
              "README.md",
              "| **Current version** | **0.2.82** (experimental channel) |",
              "| **Current version** | **0.2.86** (experimental channel) |",
          )
          replace_exact(
              "SOURCE_OF_TRUTH.md",
              "CURRENT VERSION IN TREE: 0.2.82",
              "CURRENT VERSION IN TREE: 0.2.86",
          )

          notes = base64.b64decode(
              ""
          )
          Path("docs/RELEASE_0.2.86.md").write_bytes(notes)
          PY

      - name: Validate release-only change set
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_no_p25_guard.py
          base="$(git merge-base origin/master HEAD)"
          python3 scripts/verify_no_p25_changes.py --base "${base}" --head HEAD
          git diff --check

      - name: Commit release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt README.md SOURCE_OF_TRUTH.md docs/RELEASE_0.2.86.md
          git commit -m "Prepare SDR Town 0.2.86 release metadata"
          git push origin HEAD:fix/release-v0.2.86-metadata
