name: Apply Satcom pass UI throttle

on:
  push:
    branches:
      - fix/satcom-scanner-audio-spectrum

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[satcom-pass-ui-throttle-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/satcom-scanner-audio-spectrum
          fetch-depth: 1
      - name: Remove high-rate queued callback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/SatcomScannerEngine.cpp')
          s = p.read_text(encoding='utf-8')
          old = '''            processLockedAudio();
              std::function<void()> cb;
              {
                  std::lock_guard<std::mutex> lk(mutex_);
                  cb = updateCb_;
              }
              if (cb) { try { cb(); } catch (...) {} }
              std::this_thread::sleep_for(std::chrono::milliseconds(20));
          '''
          new = '''            processLockedAudio();
              // The visible widget already snapshots at 2 Hz. Do not enqueue a Qt
              // callback for every 20 ms IQ block during an armed pass.
              std::this_thread::sleep_for(std::chrono::milliseconds(20));
          '''
          if s.count(old) != 1:
              raise SystemExit(f'pass callback block count={s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-satcom-pass-ui-throttle.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/SatcomScannerEngine.cpp
          git commit -m 'fix(satcom): throttle armed-pass UI updates [satcom-pass-ui-throttle-applied]'
          git push origin HEAD:fix/satcom-scanner-audio-spectrum
