name: Apply SDR Town 0.2.87 release metadata

on:
  push:
    branches:
      - fix/release-v0.2.87-metadata
    paths:
      - scripts/apply_release_0287_metadata.py
      - .github/workflows/apply-release-0287-metadata.yml

permissions:
  contents: write

concurrency:
  group: apply-release-0287-metadata
  cancel-in-progress: false

jobs:
  apply:
    name: Generate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout metadata branch
        uses: actions/checkout@v7
        with:
          ref: fix/release-v0.2.87-metadata
          fetch-depth: 0

      - name: Apply guarded metadata changes
        run: python3 scripts/apply_release_0287_metadata.py

      - name: Validate release-only scope
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_no_p25_guard.py
          base="$(git merge-base origin/master HEAD)"
          python3 scripts/verify_no_p25_changes.py --base "${base}" --head HEAD
          git diff --check

      - name: Commit release metadata only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt README.md SOURCE_OF_TRUTH.md docs/RELEASE_0.2.87.md
          git commit -m "Prepare SDR Town 0.2.87 release metadata"
          git push origin HEAD:fix/release-v0.2.87-metadata
