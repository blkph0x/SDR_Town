name: Apply isolated HF receive hardening

on:
  push:
    branches:
      - fix/hf-receive-hardening
    paths:
      - scripts/apply_hf_hardening.py
      - .github/workflows/apply-hf-hardening.yml

permissions:
  contents: write

concurrency:
  group: apply-isolated-hf-receive-hardening
  cancel-in-progress: false

jobs:
  apply:
    name: Generate guarded HF integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: fix/hf-receive-hardening
          fetch-depth: 0

      - name: Apply exact source integration
        run: python3 scripts/apply_hf_hardening.py

      - name: Validate frozen P25 boundary and HF contracts
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin master
          base="$(git merge-base origin/master HEAD)"
          python3 scripts/test_no_p25_guard.py
          python3 scripts/verify_hf_integration.py
          python3 scripts/verify_no_p25_changes.py --base "${base}" --head HEAD
          g++ -std=c++20 -O2 -Wall -Wextra -pedantic \
            -Iinclude \
            tests/hf_smoke.cpp \
            src/HfDemod.cpp \
            -o hf_smoke
          ./hf_smoke
          git diff --check

      - name: Commit generated source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            CMakeLists.txt \
            include/HfDemod.h \
            src/HfDemod.cpp \
            src/Demod.cpp \
            tests/test_hf_demod.cpp \
            tests/hf_smoke.cpp \
            docs/HF_RECEIVE.md \
            scripts/verify_hf_integration.py \
            scripts/verify_no_p25_changes.py \
            scripts/test_no_p25_guard.py
          git commit -m "Integrate isolated clean HF receive path"
          git push origin HEAD:fix/hf-receive-hardening
