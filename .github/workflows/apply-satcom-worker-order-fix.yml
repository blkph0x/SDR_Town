name: Apply satcom worker ordering fix

on:
  push:
    branches: [fix/satcom-auto-arm-runtime]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[satcom-worker-order-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/satcom-auto-arm-runtime
          fetch-depth: 1
      - name: Patch worker lifecycle ordering
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/SatcomScannerEngine.cpp')
          s = p.read_text(encoding='utf-8')
          old = '''    if (run_.exchange(true)) return true;
              // A previous worker can have exited after setting run_ false. Join that
              // completed thread before assigning a replacement std::thread.
              if (worker_.joinable()) worker_.join();
          '''
          new = '''    if (run_.load(std::memory_order_acquire)) return true;
              // Join a previous completed/ending worker before making run_ true again;
              // otherwise an old worker could observe the new true state and never exit.
              if (worker_.joinable()) worker_.join();
              if (run_.exchange(true, std::memory_order_acq_rel)) return true;
          '''
          if s.count(old) != 1:
              raise SystemExit(f'start lifecycle pattern count={s.count(old)}')
          s = s.replace(old, new, 1)
          old = '''void SatcomScannerEngine::stop() {
              const bool wasRunning = run_.exchange(false);
              if (wasRunning && worker_.joinable()) worker_.join();
          '''
          new = '''void SatcomScannerEngine::stop() {
              run_.store(false, std::memory_order_release);
              // Join even if the worker already cleared run_ after an early error.
              if (worker_.joinable()) worker_.join();
          '''
          if s.count(old) != 1:
              raise SystemExit(f'stop lifecycle pattern count={s.count(old)}')
          p.write_text(s, encoding='utf-8', newline='\n')
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/apply-satcom-worker-order-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SatcomScannerEngine.cpp
          git commit -m "fix(satcom): order worker join before restart [satcom-worker-order-applied]"
          git push origin HEAD:fix/satcom-auto-arm-runtime
