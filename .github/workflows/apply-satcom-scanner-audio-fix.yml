name: Apply Satcom scanner audio and spectrum fix

on:
  push:
    branches:
      - fix/satcom-scanner-audio-spectrum

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[satcom-scanner-runtime-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/satcom-scanner-audio-spectrum
          fetch-depth: 1

      - name: Apply precise runtime patch
        run: python scripts/apply_satcom_scanner_audio_fix.py

      - name: Remove one-shot patch machinery and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/apply_satcom_scanner_audio_fix.py
          git rm .github/workflows/apply-satcom-scanner-audio-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add include src tests
          git commit -m 'fix(satcom): restore scanner audio spectrum and live IQ [satcom-scanner-runtime-applied]'
          git push origin HEAD:fix/satcom-scanner-audio-spectrum
