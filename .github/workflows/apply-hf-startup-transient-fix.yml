name: Apply HF startup transient fix

on:
  push:
    branches:
      - fix/hf-receive-hardening
    paths:
      - scripts/apply_hf_startup_transient_fix.py
      - .github/workflows/apply-hf-startup-transient-fix.yml

permissions:
  contents: write

concurrency:
  group: apply-hf-startup-transient-fix
  cancel-in-progress: false

jobs:
  apply:
    name: Patch HF detector startup settling
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: fix/hf-receive-hardening
          fetch-depth: 0

      - name: Apply guarded source patch
        run: python3 scripts/apply_hf_startup_transient_fix.py

      - name: Validate frozen P25 and HF contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_no_p25_guard.py
          python3 scripts/verify_hf_integration.py
          base="$(git merge-base origin/master HEAD)"
          python3 scripts/verify_no_p25_changes.py --base "${base}" --head HEAD
          git diff --check

      - name: Commit source-only fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/HfDemod.cpp scripts/verify_hf_integration.py
          git commit -m "Suppress HF detector startup transients"
          git push origin HEAD:fix/hf-receive-hardening
