name: Apply Satcom shared audio hardening

on:
  push:
    branches:
      - fix/satcom-mainwindow-integration
    paths:
      - scripts/apply_satcom_shared_audio_fix.py
      - .github/workflows/apply-satcom-shared-audio-fix.yml

permissions:
  contents: write

concurrency:
  group: apply-satcom-shared-audio-hardening
  cancel-in-progress: false

jobs:
  apply:
    name: Patch shared audio queue ownership
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: fix/satcom-mainwindow-integration
          fetch-depth: 0

      - name: Apply guarded source patch
        run: python3 scripts/apply_satcom_shared_audio_fix.py

      - name: Validate source and frozen P25 boundary
        run: |
          python3 scripts/test_no_p25_guard.py
          python3 scripts/verify_satcom_host_integration.py
          base="$(git merge-base origin/master HEAD)"
          python3 scripts/verify_no_p25_changes.py --base "$base" --head HEAD
          git diff --check

      - name: Commit source-only hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SatcomScannerEngine.cpp scripts/verify_satcom_host_integration.py
          git commit -m "Harden Satcom shared audio queue ownership"
          git push origin HEAD:fix/satcom-mainwindow-integration
